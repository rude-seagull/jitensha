name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        # Runs `npm run build`, which is `astro build && pagefind --site dist`,
        # so the search index is produced as part of the same step.
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The action's default is 10 minutes, and it is a wait, not a build: it polls
          # `deployment_queued` until the Pages backend picks the deployment up. That
          # wait grew from 18 s to over 6 minutes across a single morning with no change
          # on our side, then crossed the default and aborted. 30 minutes rides out a
          # slow queue instead of giving up on a deployment that is merely waiting.
          timeout: 1800000
