name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        # Runs `npm run build`, which is `astro build && pagefind --site dist`,
        # so the search index is produced as part of the same step.
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Note on timeouts: `deploy-pages` caps its `timeout` input at 600000 ms, so the
      # 10-minute default is also the maximum and raising it does nothing but log a
      # warning. When the step aborts on a slow queue it leaves the Pages deployment
      # in progress, and that blocks every later deployment until it is cancelled:
      #   gh api --method POST repos/<owner>/<repo>/pages/deployments/<sha>/cancel
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
